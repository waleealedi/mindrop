# ملاحظة: قالب Flutter الافتراضي يضع هنا -Xmx8G -XX:MaxMetaspaceSize=4G
# أي 12 جيجا مسموحة لعملية بناء واحدة. هذا معقول على جهاز 32 أو 64 جيجا،
# لكنه كارثي على جهاز بـ 8 جيجا: Gradle يمدّ يده لكل الذاكرة المتاحة،
# فيدفع النظام كله للـ swap ويصير كل شي بطيء — والبناء نفسه ما يستفيد،
# لأن مشروع بحجمنا ما يحتاج ولا ربع هذا.
#
# الأرقام أدناه كافية تمامًا لمشروع Flutter بهذا الحجم وتترك للنظام
# مساحة يتنفس فيها.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# مترجم Kotlin يشغّل عملية JVM منفصلة خاصة فيه — بدون هذا السطر ياخذ
# حصة افتراضية كبيرة فوق حصة Gradle نفسها.
kotlin.daemon.jvmargs=-Xmx768m

# يبني الوحدات المستقلة بالتوازي، لكن بحد أقصى عاملين اثنين فقط عشان
# ما نرجع لنفس مشكلة استهلاك الذاكرة من الباب الثاني.
org.gradle.parallel=true
org.gradle.workers.max=2

# يخزّن نتائج المهام اللي ما تغيّرت — يقصّر زمن البناء المتكرر كثيرًا.
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
